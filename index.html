<!DOCTYPE html>
<html lang="zh-TW">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Smarlit Bushing</title>
  
  <!-- Markdown 即時解析器 CDN -->
  <script src="https://cdn.jsdelivr.net/npm/marked/marked.min.js"></script>

  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; }
    body { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; background: #f4f6f8; color: #333; line-height: 1.6; }
    .container { max-width: 900px; margin: 30px auto; padding: 25px; background: #fff; border-radius: 8px; box-shadow: 0 2px 8px rgba(0,0,0,0.1); }
    h1, h2, h3 { color: #1a1a1a; margin-bottom: 15px; }
    .subtitle { color: #666; margin-bottom: 20px; }
    
    .card { background: #fafafa; border: 1px solid #e1e4e8; border-radius: 6px; padding: 20px; margin-bottom: 20px; }
    .form-group { margin-bottom: 15px; }
    label { display: block; font-weight: 600; margin-bottom: 5px; }
    input[type="text"], input[type="password"] {
      width: 100%; padding: 10px; border: 1px solid #ccc; border-radius: 4px; font-size: 14px;
    }
    .file-drop-zone { border: 2px dashed #0066cc; border-radius: 6px; padding: 30px; text-align: center; background: #f0f7ff; cursor: pointer; margin-bottom: 15px; }
    
    button { padding: 8px 16px; background: #0066cc; color: #fff; border: none; border-radius: 4px; cursor: pointer; font-weight: 600; font-size: 14px; }
    button:hover { background: #0052a3; }
    button.secondary { background: #e2e8f0; color: #333; }
    button.secondary:hover { background: #cbd5e1; }
    
    .status-msg { margin-top: 15px; padding: 10px; border-radius: 4px; font-size: 14px; display: none; }
    .status-success { background: #d4edda; color: #155724; border: 1px solid #c3e6cb; }
    .status-error { background: #f8d7da; color: #721c24; border: 1px solid #f5c6cb; }
    .status-info { background: #d1ecf1; color: #0c5460; border: 1px solid #bee5eb; }
    
    .view-panel { display: none; }
    .badge { display: inline-block; padding: 3px 8px; background: #e2e8f0; border-radius: 12px; font-size: 12px; margin-left: 5px; }

    /* 渲染區頂部工具列 */
    .site-toolbar {
      display: flex; justify-content: space-between; align-items: center;
      padding: 10px 15px; background: #24292e; color: #fff; border-radius: 6px 6px 0 0;
    }
    .site-toolbar-title { font-weight: bold; font-size: 16px; }
    .site-toolbar-actions { display: flex; gap: 8px; }

    /* 初次開啟提示橫幅 */
    .notice-banner {
      background: #fff3cd; color: #856404; padding: 10px 15px;
      border: 1px solid #ffeeba; border-top: none; font-size: 14px;
      display: flex; justify-content: space-between; align-items: center;
    }

    /* Iframe 與 Markdown 容器 */
    .render-wrapper { border: 1px solid #e1e4e8; border-top: none; border-radius: 0 0 6px 6px; background: #fff; overflow: hidden; }
    iframe.site-frame { width: 100%; height: 650px; border: none; display: block; }
    .markdown-body { padding: 30px; line-height: 1.7; overflow-y: auto; max-height: 650px; }
    .markdown-body h1, .markdown-body h2 { border-bottom: 1px solid #eaecef; padding-bottom: 0.3em; margin-top: 24px; }
    .markdown-body code { background: #f6f8fa; padding: 0.2em 0.4em; border-radius: 3px; font-family: monospace; }
    .markdown-body pre { background: #f6f8fa; padding: 16px; overflow: auto; border-radius: 6px; }
  </style>

  <!-- SPA 路由路徑還原腳本 -->
  <script type="text/javascript">
    (function(l) {
      if (l.search[1] === 'p') {
        var decoded = l.search.slice(1).split('&').map(function(s) { 
          return s.replace(/~and~/g, '&') 
        }).filter(function(s) {
          return s.slice(0, 2) === 'p='
        })[0].split('=')[1];
        window.history.replaceState(null, null,
          l.pathname.slice(0, -1) + decoded + l.hash
        );
      }
    }(window.location));
  </script>
</head>
<body>

  <div class="container" id="main-container">
    <h1 id="app-title">Smarlit Bushing</h1>

    <!-- 1. 首頁視圖 -->
    <div id="home-view" class="view-panel">
      <p class="subtitle">靜態網頁工具託管與同步系統</p>
      <div class="card">
        <h3>查看別人所製作的網站</h3>
        <div style="display: flex; gap: 10px;">
          <input type="text" id="site-code-input" placeholder="輸入網站代碼 (例如: cashier-app)">
          <button onclick="navigateToSite()">前往網站</button>
        </div>
      </div>
      <p style="font-size: 14px; color: #666;">管理員入口：在網址後方輸入 <code>/staff</code> 進行檔案部署</p>
    </div>

    <!-- 2. Staff 控制台視圖 -->
    <div id="staff-view" class="view-panel">
      <h2>Staff 管理控制台</h2>
      
      <!-- 設定區塊：GitHub API -->
      <div class="card">
        <h3>1. GitHub API 設定</h3>
        <div class="form-group">
          <label for="gh-owner">GitHub 帳號/組織名稱 (Owner)</label>
          <input type="text" id="gh-owner" placeholder="例如: your-username">
        </div>
        <div class="form-group">
          <label for="gh-repo">儲存庫名稱 (Repository)</label>
          <input type="text" id="gh-repo" value="smarlit-bushing" placeholder="smarlit-bushing">
        </div>
        <div class="form-group">
          <label for="gh-token">Personal Access Token (PAT)</label>
          <input type="password" id="gh-token" placeholder="貼上 ghp_ 開頭的 Token">
        </div>
        <button onclick="saveAndVerifyConfig()">儲存並驗證連線</button>
        <div id="config-status" class="status-msg"></div>
      </div>

      <!-- 發布區塊：檔案上傳 -->
      <div class="card">
        <h3>2. 建立 / 更新專案網站</h3>
        <div class="form-group">
          <label for="upload-code">設定專案代碼 (Site Code)</label>
          <input type="text" id="upload-code" placeholder="例如: cashier-app">
        </div>

        <div class="form-group">
          <label>上傳網站檔案 (支援 HTML, CSS, JS, README.md)</label>
          <div class="file-drop-zone" onclick="document.getElementById('file-input').click()">
            <p id="file-drop-text">點擊選取檔案，或將檔案拖曳至此處</p>
            <input type="file" id="file-input" multiple style="display: none;" onchange="handleFileSelect(event)">
          </div>
          <div id="file-list" style="margin-bottom: 10px; font-size: 14px;"></div>
        </div>

        <button onclick="deployProject()" id="deploy-btn">同步發布至 GitHub</button>
        <div id="deploy-status" class="status-msg"></div>
      </div>
    </div>

    <!-- 3. 動態網站 / README 展演視圖 -->
    <div id="site-view" class="view-panel">
      <!-- 頂部工具列 -->
      <div class="site-toolbar">
        <div class="site-toolbar-title" id="toolbar-title">Smarlit Bushing</div>
        <div class="site-toolbar-actions">
          <button class="secondary" onclick="switchViewMode('app')">網頁內容</button>
          <button class="secondary" onclick="switchViewMode('md')">README.md</button>
          <button onclick="navigateHome()">返回首頁</button>
        </div>
      </div>

      <!-- 初次開啟提示橫幅 -->
      <div id="readme-notice" class="notice-banner" style="display: none;">
        <span>這是你首次存取此網站，此專案包含說明文件。</span>
        <button class="secondary" style="padding: 4px 10px; font-size: 12px;" onclick="switchViewMode('md')">立即查看 README</button>
      </div>

      <!-- 內容渲染容器 -->
      <div class="render-wrapper">
        <iframe id="site-iframe" class="site-frame" style="display: none;"></iframe>
        <div id="markdown-container" class="markdown-body" style="display: none;"></div>
      </div>
    </div>
  </div>

  <script>
    const REPO_NAME = '/smarlit-bushing'; // 若儲存庫名稱調整請隨之修改
    let currentSiteCode = '';

    // --- UTF-8 Base64 工具 ---
    function utf8ToBase64(str) {
      return btoa(encodeURIComponent(str).replace(/%([0-9A-F]{2})/g, function(match, p1) {
        return String.fromCharCode('0x' + p1);
      }));
    }

    // --- 本地設定與 API ---
    function getConfig() {
      return {
        owner: localStorage.getItem('sb_gh_owner') || '',
        repo: localStorage.getItem('sb_gh_repo') || 'smarlit-bushing',
        token: localStorage.getItem('sb_gh_token') || ''
      };
    }

    function initConfigFields() {
      const config = getConfig();
      document.getElementById('gh-owner').value = config.owner;
      document.getElementById('gh-repo').value = config.repo;
      document.getElementById('gh-token').value = config.token;
    }

    async function saveAndVerifyConfig() {
      const owner = document.getElementById('gh-owner').value.trim();
      const repo = document.getElementById('gh-repo').value.trim();
      const token = document.getElementById('gh-token').value.trim();
      const statusEl = document.getElementById('config-status');

      if (!owner || !repo || !token) {
        showStatus(statusEl, '請完整填寫所有欄位。', 'error');
        return;
      }

      showStatus(statusEl, '正在驗證 API 存取權限...', 'info');

      try {
        const res = await fetch(`https://api.github.com/repos/${owner}/${repo}`, {
          headers: { 'Authorization': `Bearer ${token}` }
        });

        if (res.ok) {
          localStorage.setItem('sb_gh_owner', owner);
          localStorage.setItem('sb_gh_repo', repo);
          localStorage.setItem('sb_gh_token', token);
          showStatus(statusEl, '驗證成功！設定已儲存至本地。', 'success');
        } else {
          const err = await res.json();
          showStatus(statusEl, `驗證失敗: ${err.message}`, 'error');
        }
      } catch (e) {
        showStatus(statusEl, `連線異常: ${e.message}`, 'error');
      }
    }

    // --- 檔案發布邏輯 ---
    let selectedFiles = [];
    function handleFileSelect(evt) {
      selectedFiles = Array.from(evt.target.files);
      const listEl = document.getElementById('file-list');
      if (selectedFiles.length === 0) { listEl.innerHTML = ''; return; }
      let html = '<strong>已選擇檔案：</strong><ul>';
      selectedFiles.forEach(f => {
        html += `<li>${f.name} <span class="badge">${(f.size/1024).toFixed(1)} KB</span></li>`;
      });
      html += '</ul>';
      listEl.innerHTML = html;
    }

    async function getFileSha(owner, repo, path, token) {
      try {
        const res = await fetch(`https://api.github.com/repos/${owner}/${repo}/contents/${path}`, {
          headers: { 'Authorization': `Bearer ${token}` }
        });
        if (res.ok) {
          const data = await res.json();
          return data.sha;
        }
      } catch (e) { return null; }
      return null;
    }

    async function deployProject() {
      const config = getConfig();
      const siteCode = document.getElementById('upload-code').value.trim();
      const statusEl = document.getElementById('deploy-status');

      if (!config.token || !config.owner) {
        showStatus(statusEl, '請先完成上方 GitHub API 設定與驗證。', 'error');
        return;
      }
      if (!siteCode || selectedFiles.length === 0) {
        showStatus(statusEl, '請填寫專案代碼並選取檔案。', 'error');
        return;
      }

      showStatus(statusEl, '準備上傳至 GitHub...', 'info');

      try {
        for (let file of selectedFiles) {
          showStatus(statusEl, `正在上傳 ${file.name}...`, 'info');
          const contentText = await file.text();
          const base64Content = utf8ToBase64(contentText);
          const path = `sites/${siteCode}/${file.name}`;
          const existingSha = await getFileSha(config.owner, config.repo, path, config.token);

          const payload = {
            message: `Deploy ${siteCode}: ${file.name}`,
            content: base64Content,
            branch: 'main'
          };
          if (existingSha) payload.sha = existingSha;

          const uploadRes = await fetch(`https://api.github.com/repos/${config.owner}/${config.repo}/contents/${path}`, {
            method: 'PUT',
            headers: { 'Authorization': `Bearer ${config.token}`, 'Content-Type': 'application/json' },
            body: JSON.stringify(payload)
          });

          if (!uploadRes.ok) throw new Error(`上傳 ${file.name} 失敗`);
        }

        const siteUrl = `${window.location.origin}${REPO_NAME}/${siteCode}`;
        showStatus(statusEl, `部署成功！網站網址：<a href="${siteUrl}" target="_blank">${siteUrl}</a>`, 'success');
        selectedFiles = [];
        document.getElementById('file-list').innerHTML = '';
      } catch (err) {
        showStatus(statusEl, err.message, 'error');
      }
    }

    function showStatus(el, msg, type) {
      el.className = `status-msg status-${type}`;
      el.innerHTML = msg;
      el.style.display = 'block';
    }

    // --- 動態渲染與 Markdown 解析邏輯 ---
    async function loadSiteContent(siteCode, isMarkdownMode) {
      currentSiteCode = siteCode;
      document.getElementById('toolbar-title').innerText = `網站：${siteCode}`;

      const iframe = document.getElementById('site-iframe');
      const mdContainer = document.getElementById('markdown-container');
      const noticeBanner = document.getElementById('readme-notice');

      // 相對路徑指引至靜態檔案目錄
      const targetPath = `${REPO_NAME}/sites/${siteCode}`;

      if (isMarkdownMode) {
        // Markdown 模式
        iframe.style.display = 'none';
        mdContainer.style.display = 'block';
        noticeBanner.style.display = 'none';
        mdContainer.innerHTML = '<p style="color:#666;">正在讀取 README.md ...</p>';

        try {
          const res = await fetch(`${targetPath}/README.md`);
          if (res.ok) {
            const markdownText = await res.text();
            mdContainer.innerHTML = marked.parse(markdownText);
          } else {
            mdContainer.innerHTML = '<p style="color:#721c24;">此專案未提供 README.md 說明文件。</p>';
          }
        } catch (e) {
          mdContainer.innerHTML = '<p style="color:#721c24;">讀取文件失敗，請確認檔案是否存在。</p>';
        }

      } else {
        // 網頁 (Iframe) 模式
        mdContainer.style.display = 'none';
        iframe.style.display = 'block';
        iframe.src = `${targetPath}/index.html`;

        // 檢查初次開啟與 README 狀態
        checkFirstVisitReadme(siteCode, targetPath);
      }
    }

    async function checkFirstVisitReadme(siteCode, targetPath) {
      const storageKey = `sb_visited_${siteCode}`;
      const noticeBanner = document.getElementById('readme-notice');
      
      if (!localStorage.getItem(storageKey)) {
        // 標記為已造訪
        localStorage.setItem(storageKey, 'true');
        try {
          // 發送 HEAD 請求確認 README.md 是否存在
          const res = await fetch(`${targetPath}/README.md`, { method: 'HEAD' });
          if (res.ok) {
            noticeBanner.style.display = 'flex';
          }
        } catch (e) {}
      } else {
        noticeBanner.style.display = 'none';
      }
    }

    function switchViewMode(mode) {
      if (!currentSiteCode) return;
      if (mode === 'md') {
        window.history.pushState({}, '', `${REPO_NAME}/${currentSiteCode}/md`);
        loadSiteContent(currentSiteCode, true);
      } else {
        window.history.pushState({}, '', `${REPO_NAME}/${currentSiteCode}`);
        loadSiteContent(currentSiteCode, false);
      }
    }

    // --- 萬用路由解析器 ---
    function parseRoute() {
      const path = window.location.pathname;
      let cleanPath = path.startsWith(REPO_NAME) ? path.slice(REPO_NAME.length) : path;
      if (cleanPath.endsWith('/')) cleanPath = cleanPath.slice(0, -1);

      document.querySelectorAll('.view-panel').forEach(el => el.style.display = 'none');

      if (!cleanPath || cleanPath === '') {
        document.getElementById('home-view').style.display = 'block';
      } else if (cleanPath === '/staff') {
        initConfigFields();
        document.getElementById('staff-view').style.display = 'block';
      } else {
        const parts = cleanPath.slice(1).split('/');
        const siteCode = parts[0];
        const subRoute = parts[1] ? parts[1].toLowerCase() : '';
        const isMarkdown = (subRoute === 'md' || subRoute === 'markdown');

        document.getElementById('site-view').style.display = 'block';
        loadSiteContent(siteCode, isMarkdown);
      }
    }

    function navigateToSite() {
      const code = document.getElementById('site-code-input').value.trim();
      if (code) {
        window.history.pushState({}, '', `${REPO_NAME}/${code}`);
        parseRoute();
      }
    }

    function navigateHome() {
      window.history.pushState({}, '', `${REPO_NAME}/`);
      parseRoute();
    }

    window.addEventListener('popstate', parseRoute);
    window.addEventListener('DOMContentLoaded', parseRoute);
  </script>
</body>
</html>
