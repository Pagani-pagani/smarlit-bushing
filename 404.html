<!DOCTYPE html>
<html lang="zh-TW">
<head>
  <meta charset="UTF-8">
  <title>Smarlit Bushing - Redirecting...</title>
  <script type="text/javascript">
    // SPA 路由轉接機制
    // 若為專案頁面 (例如 username.github.io/smarlit-bushing)，pathSegmentsToKeep 設為 1
    // 若為個人主頁 (例如 username.github.io)，pathSegmentsToKeep 設為 0
    var pathSegmentsToKeep = 1;

    var l = window.location;
    l.replace(
      l.protocol + '//' + l.hostname + (l.port ? ':' + l.port : '') +
      l.pathname.split('/').slice(0, 1 + pathSegmentsToKeep).join('/') + '/?p=' +
      l.pathname.slice(1).split('/').slice(pathSegmentsToKeep).join('/').replace(/&/g, '~and~') +
      (l.search ? '&q=' + l.search.slice(1).replace(/&/g, '~and~') : '') +
      l.hash
    );
  </script>
</head>
<body>
</body>
</html>
